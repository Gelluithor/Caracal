# Builds the CARACAL node image for Raspberry Pi (arm64) and PCs (amd64) and publishes it to GHCR.
#   push to main          -> ghcr.io/<owner>/caracal-node:edge
#   tag v2026.10.06 etc.  -> ghcr.io/<owner>/caracal-node:2026.10.06 and :latest
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)-edge.${GITHUB_SHA::7}"; fi
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caracal-node" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }},${{ steps.version.outputs.image }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ steps.version.outputs.image }}:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
