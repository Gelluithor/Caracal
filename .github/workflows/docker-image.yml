# Builds the CARACAL node image for Raspberry Pi (arm64) and PCs (amd64) and publishes it to GHCR.
#   push to main          -> ghcr.io/<owner>/caracal-node:edge
#   tag v2026.10.06 etc.  -> ghcr.io/<owner>/caracal-node:2026.10.06 and :latest, GitHub Release
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q -p no:cacheprovider tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)-edge.${GITHUB_SHA::7}"; fi
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caracal-node" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }},${{ steps.version.outputs.image }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ steps.version.outputs.image }}:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag v* also creates the GitHub Release (Releases tab): the message of an annotated tag is its notes, a plain tag
  # gets notes generated from the commits since the previous tag. Runs after the image was published; skipped when the release exists already (re-run).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: GitHub Release
        run: |
          TAG="$GITHUB_REF_NAME"
          V="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caracal-node"
          TITLE="CARACAL"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists"; exit 0; fi
          # an annotated tag carries the release notes; a plain tag gets notes generated from the commits
          NOTES=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.url' \
            | xargs -r -I{} gh api {} --jq .message)
          if [ -n "$NOTES" ]; then
            printf '%s\n\nDocker image: `%s:%s` (also `:latest`)\n' "$NOTES" "$IMAGE" "$V" > notes.md
            gh release create "$TAG" --verify-tag --title "$TITLE $V" --notes-file notes.md
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "CARACAL $V" --generate-notes \
            --notes "Docker image: \`$IMAGE:$V\` (also \`:latest\`)"
