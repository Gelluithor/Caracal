<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CARACAL</title>
  <link rel="icon" href="/static/caracal-logo.png?v=2">
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v={{VERSION}}">
  <link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
  <script src="/static/theme.js?v={{VERSION}}"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-shell">
      <section class="login-copy" aria-hidden="true">
        <div class="login-screen">
          <div class="brand-row"><img src="/static/caracal-logo.png?v=2" class="brand-logo" alt=""><span><b>CARACAL</b><small>Digital signage</small></span></div>
          <div>
            <h1 data-t="Obrazovka, která ukazuje, co je potřeba.|The screen that shows what matters."></h1>
            <p data-t="Webové stránky, dashboardy Grafany, obrázky, videa a oznámení z jiných aplikací na jedné televizi.|Websites, Grafana dashboards, pictures, videos and notifications from other apps on one TV."></p>
          </div>
          <i class="screen-prog"></i>
        </div>
        <div class="login-stand"></div>
      </section>
      <form id="loginForm" class="login-card">
        <div class="login-lang seg"><button type="button" data-lang="cs">CS</button><button type="button" data-lang="en">EN</button></div>
        <img src="/static/caracal-logo.png?v=2" class="login-logo" alt="CARACAL">
        <h2 id="loginTitle"></h2>
        <p id="loginSub" class="muted"></p>
        <label><span data-t="Uživatel|Username"></span><input name="username" autocomplete="username" required></label>
        <label><span data-t="Heslo|Password"></span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary block" id="loginBtn" data-t="Pokračovat|Continue"></button>
        <div id="loginError" class="form-error"></div>
      </form>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <aside id="aside">
      <div class="brand"><img src="/static/caracal-logo.png?v=2" class="brand-logo" alt=""><span><b>CARACAL</b><small id="brandHost"></small></span></div>
      <nav id="nav"></nav>
      <div class="aside-foot">
        <div class="seg" id="langSeg"><button type="button" data-lang="cs">CS</button><button type="button" data-lang="en">EN</button></div>
        <button type="button" class="icon-btn" id="themeBtn"></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn"></button>
        <div class="crumbs"><small id="crumb"></small><h1 id="title"></h1></div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <dialog id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <script src="/static/notify-style.js?v={{VERSION}}"></script>
  <script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
